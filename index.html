
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>WILD RUSH | Monster Escape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="brand">WILD <span>RUSH</span></div>
      <div class="stats">
        <div>🪙 <span id="coins">0</span></div>
        <div>🏃 <span id="distance">0</span> m</div>
        <div>⚡ <span id="speed">1.0</span>x</div>
      </div>
      <div class="actions">
        <button id="pauseBtn" aria-label="Pause">Ⅱ</button>
        <button id="settingsBtn" aria-label="Settings">⚙</button>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div class="panel">
        <p class="eyebrow">THE WILDERNESS AWAITS</p>
        <h1 id="panelTitle">WILD <span>RUSH</span></h1>
        <p id="panelText">Run fast. Collect gold. Escape the beast.</p>
        <button id="startBtn" class="primary">START RUN</button>
        <p class="hint">← → Move &nbsp; • &nbsp; ↑ Jump &nbsp; • &nbsp; ↓ Slide</p>
      </div>
    </div>

    <div id="settings" class="overlay hidden">
      <div class="panel">
        <h2>SETTINGS</h2>
        <label class="setting">
          <span>Sound effects</span>
          <input id="soundToggle" type="checkbox" checked>
        </label>
        <label class="setting">
          <span>Camera shake</span>
          <input id="shakeToggle" type="checkbox" checked>
        </label>
        <label class="setting">
          <span>Graphics</span>
          <select id="quality">
            <option value="high">High</option>
            <option value="low">Performance</option>
          </select>
        </label>
        <button id="closeSettings" class="primary">BACK TO GAME</button>
      </div>
    </div>

    <div class="mobile-controls">
      <button data-action="left" aria-label="Move left">◀</button>
      <button data-action="jump" aria-label="Jump">▲</button>
      <button data-action="slide" aria-label="Slide">▼</button>
      <button data-action="right" aria-label="Move right">▶</button>
    </div>
    <div class="footer">WILD RUSH <span>•</span> MONSTER ESCAPE</div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
